version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    assignees: ["KrzysztofHajdamowicz"]
    labels: ["dependencies"]
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    assignees: ["KrzysztofHajdamowicz"]
    labels: ["dependencies"]
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
