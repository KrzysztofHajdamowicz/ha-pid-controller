# Categories of the automatically generated release notes, by pull request label.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "⚠️ Breaking changes"
      labels:
        - breaking
    - title: "✨ New features"
      labels:
        - enhancement
    - title: "🐛 Bug fixes"
      labels:
        - bug
    - title: "📝 Documentation"
      labels:
        - documentation
    - title: "🧪 Tests and CI"
      labels:
        - tests
    - title: "⬆️ Dependencies"
      labels:
        - dependencies
    - title: "Other changes"
      labels:
        - "*"
