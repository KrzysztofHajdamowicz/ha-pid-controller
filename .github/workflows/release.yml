---
name: "Release"

# Push a version tag on a commit of `dev` to publish a release:
#
#   git tag -a v2.1.0 -m v2.1.0 && git push origin v2.1.0
#
# The workflow waits for a green CI run on the tagged commit, writes the
# version into manifest.json of the release zip (the repository keeps
# v0.0.0), builds pid_controller.zip and publishes a GitHub release with
# generated notes (categories are configured in .github/release.yml).
# A suffix (v2.1.0-beta1, also -pre, -alpha, -rc) publishes a pre-release.
#
# Run it manually (Actions → Release → Run workflow) to preview the release
# notes of a version without tagging or publishing anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to preview the release notes for, e.g. v2.1.0"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: "Publish release"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      DRY_RUN: ${{ github.event_name != 'push' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MANIFEST: custom_components/pid_controller/manifest.json
    steps:
      - name: "Validate the version"
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(pre|alpha|beta|rc)[0-9]*)?$ ]]; then
            echo "::error::Version '$VERSION' does not match vX.Y.Z or vX.Y.Z-(pre|alpha|beta|rc)N"
            exit 1
          fi

      - name: "Checkout the repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Check that the tag is on dev"
        if: ${{ env.DRY_RUN == 'false' }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "::error::$VERSION points to $GITHUB_SHA, which is not on the dev branch"
            exit 1
          fi

      - name: "Wait for CI on the tagged commit"
        if: ${{ env.DRY_RUN == 'false' }}
        run: |
          # The tag is often pushed right after the merge, while CI still runs.
          for attempt in $(seq 1 60); do
            conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --event push --json status,conclusion \
              --jq 'if any(.[]; .conclusion == "success") then "success"
                    elif any(.[]; .status != "completed") then "pending"
                    elif length == 0 then "missing"
                    else .[0].conclusion end')
            case "$conclusion" in
              success) echo "CI passed on $GITHUB_SHA"; exit 0 ;;
              pending|missing) echo "CI on $GITHUB_SHA: $conclusion, waiting ($attempt/60)"; sleep 30 ;;
              *) echo "::error::CI on $GITHUB_SHA is '$conclusion'"; exit 1 ;;
            esac
          done
          echo "::error::CI on $GITHUB_SHA did not finish within 30 minutes"
          exit 1

      - name: "Find the previous release tag"
        id: previous
        run: |
          # A pre-release is compared with the previous tag of any kind,
          # a stable release with the previous stable release.
          tags=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname --merged HEAD \
            | grep -vx "$VERSION" || true)
          if [[ "$VERSION" != *-* ]]; then
            tags=$(grep -v '[-]' <<<"$tags" || true)
          fi
          previous=$(head -n 1 <<<"$tags")
          echo "Previous tag: ${previous:-<none>}"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"

      - name: "Build pid_controller.zip"
        run: |
          jq --arg version "$VERSION" '.version = $version' "$MANIFEST" > manifest.tmp
          mv manifest.tmp "$MANIFEST"
          git diff
          cd custom_components/pid_controller
          zip -r "$GITHUB_WORKSPACE/pid_controller.zip" ./ -x '__pycache__/*'

      - name: "Publish the release"
        if: ${{ env.DRY_RUN == 'false' }}
        env:
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          args=(--verify-tag --title "$VERSION" --generate-notes)
          if [[ -n "$PREVIOUS" ]]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" pid_controller.zip "${args[@]}"

      - name: "Preview the release notes"
        if: ${{ env.DRY_RUN == 'true' }}
        env:
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          args=(-f "tag_name=$VERSION" -f "target_commitish=$GITHUB_SHA")
          if [[ -n "$PREVIOUS" ]]; then
            args+=(-f "previous_tag_name=$PREVIOUS")
          fi
          {
            echo "## Preview: $VERSION (previous: ${PREVIOUS:-none})"
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body
          } >> "$GITHUB_STEP_SUMMARY"
